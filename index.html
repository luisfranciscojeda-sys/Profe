<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detectives del Pensamiento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F1FA;--card:#fff;--ink:#1B2240;--muted:#5E6584;--line:#E1DEEE;--navy:#22305E;--yellow:#FFC93C;
 --good:#16996A;--goodbg:#E3F6EE;--bad:#D63E4E;--badbg:#FCE9EB;
 --l1:#F4D5D9;--l2:#FFE7B3;--l3:#CDEBDD;--l4:#C9D4FF}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:19px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100vh}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.15}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit}
.app{max-width:1040px;margin:0 auto;padding:22px 22px 48px;min-height:100vh;display:flex;flex-direction:column}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:14px 24px;border-radius:18px;font-weight:800;font-size:20px;background:var(--navy);color:#fff;box-shadow:0 4px 0 #111a3a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #111a3a}
.btn.y{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 #c99500}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{min-height:48px;padding:8px 16px;font-size:16px;border-radius:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row > .btn{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:'Baloo 2';font-weight:800;font-size:25px;color:var(--navy)}
.brand .b{width:48px;height:48px;border-radius:14px;background:var(--navy);display:grid;place-items:center;font-size:26px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;display:inline-flex;gap:6px;align-items:center}
.iconbtn{min-width:56px;min-height:56px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:24px;display:grid;place-items:center;flex:none}
.panel{background:var(--card);border-radius:28px;padding:26px;border:2px solid var(--line)}
.kicker{font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.muted{color:var(--muted)} .lead{font-size:21px}
.hero{background:var(--navy);color:#fff;border-radius:28px;padding:24px 28px;margin-bottom:22px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.hero h1{font-size:32px}.hero p{color:#C9D0EE}
/* players */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0 18px}
.pbtn{min-height:84px;border-radius:18px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:20px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pbtn small{font-weight:600;color:var(--muted);font-size:14px}
.pbtn.on{border-color:var(--navy);background:#EEF0FB}
input.inp,textarea.inp{width:100%;min-height:60px;border-radius:16px;border:3px solid var(--line);padding:12px 16px;font-size:20px;font-weight:700;background:#fff}
textarea.inp{min-height:110px;font-weight:600;resize:vertical}
label.l{font-weight:800;display:block;margin:12px 0 6px}
/* missions */
.missions{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-bottom:22px}
.mcard{background:var(--card);border-radius:22px;padding:20px;text-align:left;border:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mcard .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px}
.mcard h3{font-size:23px}
.stages{display:flex;gap:6px;margin-top:4px}
.stg{flex:1;text-align:center;border-radius:10px;padding:6px 4px;font-size:14px;font-weight:800;background:var(--bg);color:var(--muted)}
.stg.done{background:var(--goodbg);color:var(--good)}
.stg.open{background:#FFF3CC;color:#8A6400}
.lvl{display:inline-block;padding:4px 10px;border-radius:99px;font-size:14px;font-weight:800}
.lv0{background:var(--bg);color:var(--muted)}.lv1{background:var(--l1)}.lv2{background:var(--l2)}.lv3{background:var(--l3)}.lv4{background:var(--l4)}
.stagebtn{width:100%;text-align:left;min-height:88px;border-radius:20px;border:3px solid var(--line);background:var(--card);padding:16px 18px;display:flex;align-items:center;gap:16px;margin-bottom:12px}
.stagebtn .n{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--navy);color:#fff;flex:none}
.stagebtn:disabled{opacity:.5}
.stagebtn b{display:block;font-size:20px}
/* lesson */
.tool{border-radius:22px;padding:22px;margin:16px 0;color:#fff}
.tool .q{font-family:'Baloo 2';font-size:27px;line-height:1.2;margin:4px 0 8px}
.steps{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.step{background:var(--bg);border-radius:18px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.step .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}
.quote{background:#FFF8E1;border-left:6px solid var(--yellow);border-radius:14px;padding:16px 18px;font-size:22px;font-weight:700;margin:14px 0}
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.prog{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .4s}
.challenge{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:820px){.challenge.two{grid-template-columns:1.05fr 1fr;align-items:start}}
.stim{background:var(--card);border-radius:24px;padding:22px;border:2px solid var(--line)}
.tag{display:inline-block;font-weight:800;font-size:15px;padding:5px 12px;border-radius:99px;background:var(--bg);margin-bottom:12px}
.text{font-size:23px;font-weight:700;line-height:1.4}
.post{border:2px solid var(--line);border-radius:18px;padding:16px;background:#FAFAFE}
.post .who{display:flex;gap:10px;align-items:center;font-weight:800;margin-bottom:8px}
.post .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--line)}
.q2{font-family:'Baloo 2';font-size:26px;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:12px}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opt{min-height:72px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 18px;text-align:left;font-weight:700;font-size:20px;display:flex;align-items:center;gap:12px}
.opt .e{font-size:28px}
.opt.center{justify-content:center;text-align:center;font-size:23px}
.opt.sel{border-color:var(--navy);background:#EEF0FB}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.sent{display:block;width:100%;text-align:left;min-height:64px;padding:14px 16px;border-radius:16px;border:3px dashed var(--line);background:var(--card);font-size:20px;font-weight:600;margin-bottom:10px}
.sent.good{border-style:solid;border-color:var(--good);background:var(--goodbg)}
.sent.bad{border-style:solid;border-color:var(--bad);background:var(--badbg)}
.hintbox{background:#FFF8E1;border-radius:16px;padding:14px 16px;margin-top:12px;font-weight:600}
.fb{border-radius:20px;padding:18px 20px;margin-top:14px}
.fb.good{background:var(--goodbg)}.fb.bad{background:var(--badbg)}.fb.info{background:#EEF0FB}
.fb h3{font-size:23px;margin-bottom:4px}
.fb.good h3{color:var(--good)}.fb.bad h3{color:var(--bad)}.fb.info h3{color:var(--navy)}
.fb .tip{margin-top:8px;font-weight:700}
.invest{border-radius:16px;padding:14px 16px;background:#E8F4FF;margin-top:12px;font-weight:600}
.talk{background:#FFF1D6;border-radius:18px;padding:16px 18px;margin-top:14px;display:flex;gap:12px;align-items:flex-start;font-weight:700}
.talk .e{font-size:30px}
.lab-tricks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:14px 0}
.result{text-align:center}
.result .medal{font-size:100px;line-height:1;margin:6px 0 8px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
/* teacher */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{min-height:52px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:17px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;background:#fff;border-radius:16px;overflow:hidden;border:2px solid var(--line)}
.tbl th,.tbl td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:#F7F6FC;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.c{text-align:center}
.scroll{overflow-x:auto}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.card2{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--bad)}
.ev{background:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:17px}
.ev b{display:block}
.guide h3{font-size:22px;margin:18px 0 8px}.guide ul{padding-left:24px}.guide li{margin-bottom:6px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:12px;height:16px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(600deg)}}
.modal{position:fixed;inset:0;background:rgba(27,34,64,.55);display:grid;place-items:center;padding:20px;z-index:40}
.modal > div{background:var(--card);border-radius:24px;padding:24px;max-width:520px;width:100%}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;z-index:50}
@media (max-width:600px){body{font-size:18px}.opts.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ===================== CONTENIDO ===================== */
const TRICKS=[
 {e:"😱",n:"Emoción exagerada",d:"Usa mayúsculas, alarma o rabia para que compartas sin pensar."},
 {e:"🎭",n:"Falso experto o imitación",d:"Alguien se hace pasar por experto, o por una institución o persona confiable."},
 {e:"🤷",n:"Sin fuente",d:"«Dicen que…», «todo el mundo sabe…», pero nunca dice quién ni cómo lo sabe."},
 {e:"🪤",n:"Titular trampa",d:"El título promete algo que la noticia en realidad no dice."}];
const FALL=[
 {e:"🔍",n:"Conclusión apurada",d:"Saca una regla para todos a partir de uno o pocos casos."},
 {e:"👉",n:"Atacar a la persona",d:"Critica a quien habla en vez de responder a su idea."},
 {e:"🐑",n:"«Todos lo hacen»",d:"Algo sería correcto solo porque mucha gente lo hace."},
 {e:"⚖️",n:"Solo dos caminos",d:"Presenta dos opciones como si no existieran otras."}];
const LEVELS=["Sin datos","Inicial","En desarrollo","Logrado","Avanzado"];

const MISSIONS=[
{id:"m1",n:"Hecho u opinión",e:"🧩",c:"#5B4BDB",type:"choice",
 story:"Al tablero del curso llegaron mensajes mezclados. Algunos se pueden comprobar y otros son gustos o creencias.",
 tool:{name:"La pregunta del comprobador",q:"¿Se puede comprobar con datos, un mapa, una medición o un documento?",
  ex:"Si se puede comprobar, es un HECHO (aunque a veces resulte falso). Si depende de gustos o creencias, es una OPINIÓN. Palabras pista de opinión: mejor, peor, lindo, aburrido, creo, debería, injusto."},
 worked:{text:"«Chile continental mide más de 4.000 km de largo.»",steps:["Me hago la pregunta del comprobador: ¿se puede comprobar?","Sí: puedo medirlo en un mapa o buscarlo en un atlas.","No tiene palabras como «mejor» o «lindo».","Conclusión: es un HECHO."]},
 q:"¿Es un hecho o una opinión?",opts:[{e:"📏",n:"Hecho"},{e:"💭",n:"Opinión"}],
 stages:[
  {items:[
   {s:"Santiago es la capital de Chile.",a:0,h:"¿Podrías comprobarlo en un atlas?",x:"Se puede comprobar en un mapa o en la Constitución: es un hecho."},
   {s:"El completo es la comida más rica del mundo.",a:1,h:"Fíjate en «más rica». ¿Eso se mide?",x:"«Más rica» depende del gusto de cada persona: es una opinión."},
   {s:"Las Fiestas Patrias se celebran el 18 de septiembre.",a:0,h:"¿Se puede revisar en un calendario?",x:"Está en el calendario oficial: es un hecho."},
   {s:"Matemáticas es la asignatura más aburrida.",a:1,h:"¿A todos les aburre lo mismo?",x:"«Aburrida» es un juicio personal; a otros les encanta. Es una opinión."},
   {s:"Los perros son mejores mascotas que los gatos.",a:1,h:"Busca la palabra pista.",x:"«Mejores» depende de lo que cada persona valora: es una opinión."}]},
  {items:[
   {s:"Según una encuesta, 21 de 30 estudiantes prefieren el recreo largo.",a:0,h:"La frase cuenta lo que dijo la encuesta. ¿Eso se puede revisar?",x:"«Preferir» suena a gusto, pero la frase informa un resultado que se puede revisar contando las respuestas. Es un hecho."},
   {s:"Una historiadora dice que la Independencia fue el hecho más importante de la historia de Chile.",a:1,h:"Que lo diga una experta, ¿hace que «el más importante» se pueda medir?",x:"Aunque lo diga una experta, «el más importante» es un juicio. Es una opinión (bien informada, pero opinión)."},
   {s:"En 1949 se aprobó en Chile el voto pleno de las mujeres.",a:0,h:"¿Hay leyes y documentos que lo registren?",x:"Está registrado en la ley y en documentos históricos: es un hecho."},
   {s:"Es injusto que el recreo dure solo 15 minutos.",a:1,h:"Lo que dura el recreo se mide, pero «injusto»…",x:"La duración se puede medir, pero «injusto» es una valoración. La frase es una opinión."},
   {s:"En el sur de Chile llueve más que en el norte.",a:0,h:"¿Existen mediciones de lluvia?",x:"Las estaciones meteorológicas miden la lluvia: es un hecho comprobable."}]},
  {write:{q:"Piensa en un tema que estés estudiando en Historia o Formación Ciudadana.",fields:["Escribe un HECHO sobre ese tema","Escribe una OPINIÓN sobre ese mismo tema","¿Cómo sabes cuál es cuál?"]}}],
 close:{q:"¿Qué pregunta te ayudó en esta misión?",o:["¿Me gusta o no me gusta?","¿Se puede comprobar con datos, un mapa o un documento?","¿Lo dijo alguien famoso?"],a:1},
 talk:"Piensen en una opinión que tengan. ¿Qué hechos podrían usar para defenderla?"},

{id:"m2",n:"¿Qué lo demuestra?",e:"🔎",c:"#1A8C78",type:"evidence",
 story:"Cuando alguien afirma algo, un buen detective busca la prueba. No basta con que suene bien.",
 tool:{name:"Busca la prueba",q:"¿Qué oración muestra que la afirmación es verdad?",ex:"Una buena prueba trae datos, observaciones o ejemplos concretos. Una opinión, o un dato sin relación con la afirmación, no sirven como prueba."},
 worked:{text:"Afirmación: «Este año el curso leyó más libros.»",steps:["Leo cada oración y me pregunto: ¿esto lo demuestra?","«La biblioteca es muy bonita» → opinión, no prueba nada.","«El año pasado leímos 40 libros y este año 75» → ¡datos de antes y después!","Esa es la prueba."]},
 stages:[
  {items:[
   {claim:"El huerto escolar ayudó a que el curso comiera más verduras.",s:["El huerto se construyó en marzo, al lado del gimnasio.","Antes del huerto, 8 de 30 estudiantes comían ensalada; en junio eran 19.","La profesora dice que el huerto quedó precioso.","Las lechugas crecieron muy rápido."],a:1,h:"Busca la oración que compare el antes y el después.",x:"La segunda oración da datos de antes y después. Las otras describen el huerto o dan opiniones."},
   {claim:"Los delfines son animales inteligentes.",s:["Los delfines viven en casi todos los océanos.","Son muy simpáticos y a todo el mundo le gustan.","En experimentos, algunos delfines se reconocen en un espejo, algo que muy pocos animales logran.","Pueden nadar muy rápido."],a:2,h:"¿Cuál habla de lo que el delfín puede entender?",x:"Reconocerse en un espejo es una observación de un experimento sobre su mente. Ser simpático o rápido no demuestra inteligencia."}]},
  {items:[
   {claim:"El letrero de «No correr» redujo los accidentes en el pasillo.",s:["El letrero es rojo y muy grande.","El inspector cree que el letrero funciona.","En abril hubo 12 accidentes; en mayo, con el letrero, hubo 4.","A muchos estudiantes les gusta el letrero."],a:2,h:"Las creencias no son pruebas. Busca números.",x:"Los datos de abril y mayo son la prueba. Que el inspector «crea» que funciona es una opinión."},
   {kind:"choice",s:"En mayo hubo menos accidentes. ¿Eso prueba que fue SOLO gracias al letrero?",o:["Sí, 100% seguro.","Es una buena pista, pero pudo haber otras causas (por ejemplo, menos días de clases en mayo)."],a:1,h:"¿Pudo cambiar algo más entre abril y mayo?",x:"Los datos apoyan la idea, pero otras cosas también pudieron cambiar. Un buen pensador busca otras explicaciones posibles."},
   {claim:"Desayunar ayuda a rendir mejor en las pruebas.",s:["Mi abuela dice que el desayuno es la comida más importante del día.","Un estudio con 500 estudiantes encontró que quienes desayunaban obtuvieron, en promedio, mejores resultados.","La leche tiene calcio.","A muchos niños les gusta el pan con palta."],a:1,h:"¿Cuál trae datos sobre pruebas y desayuno?",x:"El estudio compara a muchos estudiantes. Lo que dice la abuela es una opinión, y lo del calcio no habla de pruebas."}]},
  {write:{q:"Alguien dice: «Los perros son más inteligentes que los gatos».",fields:["¿Qué prueba le pedirías para creerle?","¿Por qué esa prueba sí serviría?"]}}],
 close:{q:"¿Qué hace que algo sea una buena prueba?",o:["Que suene convincente","Que tenga datos, observaciones o ejemplos concretos","Que lo diga una persona simpática"],a:1},
 talk:"¿Qué prueba le pedirían a alguien que dice «los videojuegos hacen mal»?"},

{id:"m3",n:"¿Quién está detrás?",e:"🕵️",c:"#2F6FE4",type:"source",
 story:"Los verificadores profesionales SALEN de la página para averiguar quién está detrás antes de creer. Esto se llama lectura lateral.",
 tool:{name:"Investiga antes de creer",q:"¿Quién publica esto y qué dicen otros sobre esa fuente?",ex:"No te quedes con lo que la página dice de sí misma. Revisa qué dicen otras fuentes, si busca venderte algo y si otros medios confiables publican lo mismo."},
 worked:{text:"Un sitio muy bonito dice: «Esta pulsera mágica cura el resfrío».",steps:["En vez de leer todo el sitio, abro otra pestaña y busco quién lo publica.","Descubro que el mismo sitio vende la pulsera.","Ningún médico ni institución de salud dice que funcione.","Conclusión: DUDO de esta información."]},
 stages:[
  {items:[
   {who:"SaludNatural-Hoy.com",av:"🍫",says:"¡Comer chocolate todos los días te convierte en un genio!",inv:"Este sitio vende chocolates «para la inteligencia». No dice quién escribe y ninguna institución científica dice lo mismo.",a:1,x:"Quiere venderte algo y nadie confiable lo respalda. ¡Hay que dudar!"},
   {who:"Dirección Meteorológica de Chile",av:"🌦️",says:"Mañana se esperan lluvias en Concepción.",inv:"Es el organismo del Estado que estudia el tiempo y el clima. Usa estaciones de medición en todo el país.",a:0,x:"Es una fuente experta y usa mediciones. Es confiable (aunque los pronósticos a veces fallan)."}]},
  {items:[
   {who:"NoticiasUrgentes_CL",av:"📺",says:"ÚLTIMO MINUTO: se suspenden las clases en todo Chile mañana.",inv:"La cuenta se creó hace 3 días y usa un logo parecido al de un canal de TV. El canal real dice que no es suya. Ningún otro medio ni el Ministerio de Educación publican esa noticia.",a:1,x:"Imita a un canal real y nadie más publica la noticia. Revisa las fuentes oficiales."},

let DB={dev:"T"+Math.random().toString(36).slice(2,6).toUpperCase(),seq:0,pin:"1234",students:{},log:[],valid:{}};
try{const r=localStorage.getItem(KEY);if(r)DB=Object.assign(DB,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast("No se pudo guardar en esta tablet");}}
let PLAYERS=[];
/* Evento: id, u=código, m=misión, s=etapa(0-2), a=intento, k=ítem, ok, h=pista, inv=investigó, t=segundos, x=texto, ts */
function logEv(ev){PLAYERS.forEach(u=>{DB.log.push(Object.assign({id:DB.dev+"-"+(++DB.seq),u,ts:Date.now()},ev));});save();}

function attempts(u,m,s){
  const map={};
  DB.log.forEach(e=>{if(e.u===u&&e.m===m&&e.s===s){(map[e.a]=map[e.a]||{n:0,ok:0,h:0,ts:e.ts,done:false,x:null});const A=map[e.a];
    if(e.k==="end")A.done=true;else if(e.k==="txt"){A.x=e.x;A.done=true;}else{A.n++;A.ok+=e.ok?1:0;A.h+=e.h?1:0;}}});
  return Object.entries(map).map(([a,v])=>Object.assign({a},v,{p:v.n?v.ok/v.n:0}));
}
function bestPct(u,m,s,maxH){const at=attempts(u,m,s).filter(x=>x.done&&x.n>0&&(maxH===undefined||x.h<=maxH));return at.length?Math.max(...at.map(x=>x.p)):null;}
function hasText(u,m){return attempts(u,m,2).some(x=>x.x);}
function level(u,m){
  if(DB.valid[u+"|"+m]===true) return 4;
  if((bestPct(u,m,1,1)??0)>=.7) return 3;
  if((bestPct(u,m,0)??0)>=.7) return 2;
  if(DB.log.some(e=>e.u===u&&e.m===m)) return 1;
  return 0;
}
function unlocked(u,m,s){ if(s===0)return true; if(s===1)return (bestPct(u,m,0)??0)>=.7; return (bestPct(u,m,1)??0)>=.7; }
const anyUnlocked=(m,s)=>PLAYERS.some(u=>unlocked(u,m,s));
const stageDone=(m,s)=>PLAYERS.length&&PLAYERS.every(u=>s<2?(bestPct(u,m,s)??0)>=.7:hasText(u,m));

let labSeen=[];
function lab(sel){
  if(sel===undefined)labSeen=[]; else labSeen[sel]=true;
  const all=[0,1,2,3].every(k=>labSeen[k]);
  $(`${header(4)}<div class="panel"><div class="kicker" style="color:${R.m.c}">Laboratorio de trucos</div>
    <h2 style="font-size:30px">Mira cómo se fabrica un engaño</h2>
    <p class="muted">Esta es una noticia real y tranquila. Toca cada truco para ver cómo la deformarían.</p>
    <div class="quote">📰 ${sel!==undefined?LAB[sel]:LAB_BASE}</div>
    ${sel!==undefined?`<div class="fb info"><h3>${TRICKS[sel].e} ${TRICKS[sel].n}</h3><p>${TRICKS[sel].d}</p></div>`:""}
    <div class="lab-tricks">${TRICKS.map((t,k)=>`<button class="opt ${sel===k?'sel':''}" onclick="lab(${k})"><span class="e">${t.e}</span>${t.n}${labSeen[k]?' ✓':''}</button>`).join("")}</div>
    <button class="btn y full" ${all?'':'disabled'} onclick="item()">${all?'¡Listo! A detectar trucos ▸':'Prueba los 4 trucos para continuar'}</button></div>`);
}
const items=()=>R.m.stages[R.s].items;
const cur=()=>items()[R.idx];
function item(){
  SAY.length=0;R.hint=false;R.inv=false;R.t0=Date.now();
  if(R.idx>=items().length)return endStage();
  const it=cur(),pct=8+84*(R.idx/items().length);
  const kind=it.kind||R.m.type;
  if(kind==="choice")return choiceUI(it,pct);
  if(kind==="evidence")return evidenceUI(it,pct);
  if(kind==="source")return sourceUI(it,pct);
  if(kind==="dilemma")return dilemmaUI(it,pct);
}
const pairBox=()=>PLAYERS.length===2?`<div class="talk"><span class="e">👥</span><span>Antes de tocar: conversen. ¿Qué piensan y <u>por qué</u>? Deben estar de acuerdo.</span></div>`:"";
const hintBtn=h=>h?`<div id="hintw"><button class="btn ghost sm" style="margin-top:12px" onclick="showHint()">💡 Pedir pista</button></div>`:"";
function showHint(){R.hint=true;document.getElementById("hintw").innerHTML=`<div class="hintbox">💡 ${cur().h}</div>`;}
function rec(ok,key){R.n++;if(ok)R.ok++;logEv({m:R.m.id,s:R.s,a:R.a,k:key,ok:ok?1:0,h:R.hint?1:0,inv:R.inv?1:0,t:Math.round((Date.now()-R.t0)/1000)});}
const nextBtn=()=>`<button class="btn y full" style="margin-top:14px" onclick="R.idx++;item()">Siguiente ▸</button>`;
function mark(sel,a,j){document.querySelectorAll(sel).forEach((b,k)=>{b.disabled=true;if(k===a)b.classList.add("good");else if(k===j)b.classList.add("bad");});const hw=document.getElementById("hintw");if(hw)hw.remove();}
const key=()=>R.m.id+"."+R.s+"."+R.idx;

function choiceUI(it,pct){
  const opts=it.o?it.o.map(n=>({n})):R.m.opts, grid=opts.length===2&&!it.o;
  $(`${header(pct)}<div class="challenge two">
   <div class="stim"><span class="tag">📌 Caso ${R.idx+1} de ${items().length}</span>
    <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><div class="text">${it.s}</div>${sayBtn(it.s)}</div>${hintBtn(it.h)}</div>
   <div><div class="q2">${it.o?"¿Qué piensas?":R.m.q}</div>
    <div class="opts ${grid?'grid2':''}">${opts.map((o,j)=>`<button class="opt ${grid?'center':''}" onclick="pickChoice(${j})">${o.e?`<span class="e">${o.e}</span>`:""}${o.n}</button>`).join("")}</div>
    ${pairBox()}<div id="fb"></div></div></div>`);
}
function pickChoice(j){
  const it=cur(),ok=j===it.a;mark(".opts .opt",it.a,j);rec(ok,key());
  const tip=!it.o&&R.m.id==="m4"?TRICKS[it.a].d:!it.o&&R.m.id==="m5"?FALL[it.a].d:"";
  const ans=it.o?it.o[it.a]:R.m.opts[it.a].n;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?'good':'bad'} fade"><h3>${ok?"✔ ¡Bien razonado!":"✘ Esta vez no"}</h3><p>${ok?"":`La respuesta era <b>${ans}</b>. `}${it.x}</p>${tip?`<p class="tip">🧰 ${tip}</p>`:""}</div>${nextBtn()}`;
  if(ok)confetti(14);
}
function evidenceUI(it,pct){
  $(`${header(pct)}<div class="challenge two">
   <div class="stim"><span class="tag">📣 Afirmación</span>
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div class="text">«${it.claim}»</div>${sayBtn(it.claim+". "+it.s.join(". "))}</div>${hintBtn(it.h)}${pairBox()}</div>
   <div><div class="q2">Toca la oración que lo demuestra</div>
    <div id="sents">${it.s.map((s,j)=>`<button class="sent" onclick="pickEv(${j})">${s}</button>`).join("")}</div><div id="fb"></div></div></div>`);
}
function pickEv(j){const it=cur(),ok=j===it.a;mark("#sents .sent",it.a,j);rec(ok,key());
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?'good':'bad'} fade"><h3>${ok?"✔ ¡Encontraste la prueba!":"✘ Esa oración no lo demuestra"}</h3><p>${it.x}</p></div>${nextBtn()}`;if(ok)confetti(14);}
function sourceUI(it,pct){
  $(`${header(pct)}<div class="challenge two">
   <div class="stim"><span class="tag">📱 Te llegó esto</span>
    <div class="post"><div class="who"><span class="av">${it.av}</span>${it.who}</div><div class="text">${it.says}</div></div>
    <div id="inv"><button class="btn full" style="margin-top:14px" onclick="investigate()">🔍 Investigar quién está detrás</button></div>${pairBox()}</div>
   <div><div class="q2">¿Qué haces con esta información?</div>
    <div class="opts"><button class="opt" disabled onclick="pickSrc(0)"><span class="e">✅</span>Es confiable</button><button class="opt" disabled onclick="pickSrc(1)"><span class="e">🤨</span>Hay que dudar</button></div>
    <p class="muted" id="lock" style="margin-top:10px">🔒 Un buen detective investiga primero.</p><div id="fb"></div></div></div>`);
}
function investigate(){R.inv=true;document.getElementById("inv").innerHTML=`<div class="invest fade">🔍 <b>Lo que encontraste en otras fuentes:</b><br>${cur().inv}</div>`;
  document.querySelectorAll(".opts .opt").forEach(b=>b.disabled=false);const l=document.getElementById("lock");if(l)l.remove();}
function pickSrc(j){const it=cur(),ok=j===it.a;mark(".opts .opt",it.a,j);rec(ok,key());
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?'good':'bad'} fade"><h3>${ok?"✔ ¡Bien investigado!":"✘ Revisa lo que encontraste"}</h3><p>${it.x}</p></div>${nextBtn()}`;if(ok)confetti(14);}

/* Dilemas: se evalúa la calidad de la razón, no la postura */
let D={};
const PERMS=[[1,0,2],[2,1,0],[0,2,1],[1,2,0],[2,0,1],[0,1,2]];
const KTXT={f:"💪 Razón fuerte",d:"😐 Razón débil",t:"🪤 Razón tramposa"};
function dilemmaUI(it,pct){
  D={side:null};
  $(`${header(pct)}<div class="panel"><span class="tag">💬 Dilema ${R.idx+1} de ${items().length}</span>
    <div class="row" style="justify-content:space-between;align-items:center;margin:6px 0"><h2 style="font-size:30px;flex:1">${it.q}</h2>${sayBtn(it.q)}</div>
    <p class="muted">No hay postura correcta: elige la que tú creas.</p>
    <div class="opts grid2" style="margin-top:14px">${it.sides.map((s,j)=>`<button class="opt center" onclick="pickSide(${j})"><span class="e">${s.e}</span>${s.n}</button>`).join("")}</div>${pairBox()}</div>`);
}
function reasons(side,fn,seed){return `<div class="opts" id="rs">${PERMS[seed%6].map(k=>`<button class="opt" data-k="${k}" onclick="${fn}(${k})">${side.r[k].t}</button>`).join("")}</div>`;}
function markR(side,ch){document.querySelectorAll("#rs .opt").forEach(b=>{const k=+b.dataset.k;b.disabled=true;if(side.r[k].k==="f")b.classList.add("good");else if(k===ch)b.classList.add("bad");
  b.insertAdjacentHTML("beforeend",`<span style="margin-left:auto;font-size:15px;white-space:nowrap;padding-left:10px">${KTXT[side.r[k].k]}</span>`);});}
function pickSide(j){D.side=j;R.t0=Date.now();const it=cur(),s=it.sides[j];
  $(`${header(8+84*(R.idx/items().length))}<div class="panel"><div class="kicker" style="color:${R.m.c}">Tu postura: ${s.e} ${s.n}</div>
    <h2 style="font-size:28px;margin-bottom:12px">¿Cuál es la razón más fuerte para tu postura?</h2>${reasons(s,"pickReason",R.idx*2+j+R.s)}<div id="fb"></div></div>`);}
function rMsg(r){return r.k==="f"?"Explica el porqué y piensa en las personas afectadas.":r.k==="d"?"«Porque sí» no explica nada. Una razón fuerte da el porqué.":r.why;}
function pickReason(k){const it=cur(),s=it.sides[D.side],r=s.r[k],ok=r.k==="f";markR(s,k);rec(ok,key()+".own");
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?'good':'bad'} fade"><h3>${ok?"✔ ¡Argumento sólido!":KTXT[r.k]}</h3><p>${rMsg(r)}</p></div>
   ${it.other?`<button class="btn y full" style="margin-top:14px" onclick="otherSide()">Ahora ponte en el otro lado ▸</button>`:nextBtn()}`;if(ok)confetti(14);}
function otherSide(){R.t0=Date.now();const it=cur(),o=it.sides[1-D.side];
  $(`${header(8+84*((R.idx+.5)/items().length))}<div class="panel"><div class="kicker" style="color:${R.m.c}">🔄 Empatía de detective</div>
   <h2 style="font-size:28px;margin-bottom:6px">Alguien eligió: ${o.e} ${o.n}</h2><p class="muted" style="margin-bottom:12px">¿Cuál es la mejor razón que podría dar?</p>
   ${reasons(o,"pickOther",R.idx*2+(1-D.side)+3)}<div id="fb"></div></div>`);}
function pickOther(k){const it=cur(),o=it.sides[1-D.side],r=o.r[k],ok=r.k==="f";markR(o,k);rec(ok,key()+".other");
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?'good':'bad'} fade"><h3>${ok?"✔ ¡Entendiste al otro lado!":KTXT[r.k]}</h3>
   <p>${ok?"Reconocer una buena razón del otro lado no te obliga a cambiar de opinión, pero te ayuda a conversar mejor.":rMsg(r)+" La razón fuerte está marcada en verde."}</p></div>${nextBtn()}`;if(ok)confetti(14);}

/* Etapa 3: respuesta escrita */
function writeUI(){
  SAY.length=0;const w=R.m.stages[2].write;
  $(`${header(50)}<div class="panel"><div class="kicker" style="color:${R.m.c}">✍️ ${STAGE_NAMES[2]}</div>
   <div class="tool" style="background:${R.m.c};margin-top:6px"><div class="kicker" style="color:#fff;opacity:.85">🧰 ${R.m.tool.name}</div><div class="q" style="font-size:23px">«${R.m.tool.q}»</div></div>
   <div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap"><h2 style="font-size:27px;flex:1">${w.q}</h2>${sayBtn(w.q+". "+w.fields.join(". "))}</div>
   ${w.fields.map((f,j)=>`<label class="l">${j+1}. ${f}</label><textarea class="inp" id="w${j}" oninput="chkW()"></textarea>`).join("")}
   ${PLAYERS.length===2?`<div class="talk"><span class="e">👥</span><span>Escriban juntos. Una persona escribe y la otra revisa con la herramienta.</span></div>`:""}
   <button class="btn y full" id="send" style="margin-top:16px" disabled onclick="sendW()">Enviar al profesor ▸</button></div>`);

function chkW(){const w=R.m.stages[2].write;document.getElementById("send").disabled=!w.fields.every((_,j)=>document.getElementById("w"+j).value.trim().length>=3);}
function sendW(){const w=R.m.stages[2].write;const txt=w.fields.map((f,j)=>f+": "+document.getElementById("w"+j).value.trim()).join("\n");
  logEv({m:R.m.id,s:2,a:R.a,k:"txt",x:txt,ts2:Date.now()});
  $(`<div class="panel result"><div class="medal">✍️</div><h1 style="font-size:34px">¡Respuesta enviada!</h1>
   <p class="lead muted" style="margin:8px 0 16px">Tu profesor la va a revisar. Si cumple con la herramienta, alcanzarás el nivel 4 · Avanzado.</p>
   <div class="row"><button class="btn y" onclick="home()">Volver a las misiones</button></div></div>`);confetti(40);}

/* Fin de etapa y cierre metacognitivo */
function endStage(){
  const c=R.m.close;
  $(`${header(94)}<div class="panel"><div class="kicker" style="color:${R.m.c}">🧠 Antes de terminar</div>
   <h2 style="font-size:29px;margin-bottom:14px">${c.q}</h2><div class="opts" id="cl">${c.o.map((o,j)=>`<button class="opt" onclick="pickClose(${j})">${o}</button>`).join("")}</div><div id="fb"></div></div>`);
}
function pickClose(j){const c=R.m.close;document.querySelectorAll("#cl .opt").forEach((b,k)=>{b.disabled=true;if(k===c.a)b.classList.add("good");else if(k===j)b.classList.add("bad");});
  logEv({m:R.m.id,s:R.s,a:R.a,k:"end"});
  document.getElementById("fb").innerHTML=`<div class="fb ${j===c.a?'good':'info'} fade"><h3>${j===c.a?"✔ ¡Exacto!":"Recuerda la herramienta"}</h3><p>🧰 <b>${R.m.tool.name}:</b> «${R.m.tool.q}»</p></div>
   <button class="btn y full" style="margin-top:14px" onclick="result()">Ver mi resultado ▸</button>`;}
function result(){
  const p=R.n?R.ok/R.n:0,pass=p>=.7,pc=Math.round(p*100);
  $(`<div class="panel result"><div class="medal">${pass?R.m.e:"💪"}</div>
   <h1 style="font-size:34px">${pass?"¡Etapa superada!":"¡Buen intento!"}</h1>
   <p class="lead" style="margin:6px 0">${R.ok} de ${R.n} correctas (${pc}%)</p>
   <p class="muted">${pass?(R.s<2?`Se abrió la ${STAGE_NAMES[R.s+1].split("·")[0].trim()}.`:""):"Necesitas 70% para abrir la siguiente etapa. Puedes repetirla cuando quieras."}</p>
   <div style="margin:12px 0">${PLAYERS.map(u=>`<div>${pname(u)}: ${lvlChip(level(u,R.m.id))}</div>`).join("")}</div>
   <div class="talk" style="text-align:left;margin:16px 0"><span class="e">🗣️</span><span><b>Para conversar:</b> ${R.m.talk}</span></div>
   <div class="row"><button class="btn ghost" onclick="startStage(${R.i},${R.s})">↻ Repetir etapa</button>
    ${pass&&R.s<2?`<button class="btn y" onclick="startStage(${R.i},${R.s+1})">Siguiente etapa ▸</button>`:`<button class="btn y" onclick="home()">Volver a las misiones</button>`}</div></div>`);
  if(pass)confetti(60);
}

/* ===================== PANEL DOCENTE ===================== */
function askPin(){
  const m=modal(`<h2 style="font-size:28px">Panel docente</h2><p class="muted">Ingresa la clave${DB.pin==="1234"?" (inicial: 1234; cámbiala en «Datos»)":""}.</p>
   <input class="inp" id="pn" type="password" inputmode="numeric" maxlength="8" style="margin-top:10px">
   <div class="row" style="margin-top:16px"><button class="btn ghost" id="no">Cancelar</button><button class="btn y" id="ok">Entrar</button></div>`);
  m.querySelector("#no").onclick=()=>m.remove();
  const go=()=>{if(m.querySelector("#pn").value===DB.pin){m.remove();teacher("curso");}else toast("Clave incorrecta");};
  m.querySelector("#ok").onclick=go;m.querySelector("#pn").onkeydown=e=>{if(e.key==="Enter")go();};
  setTimeout(()=>m.querySelector("#pn").focus(),50);
}
const TABS=[["vivo","🔴 En vivo"],["curso","📊 Curso"],["escritos","✍️ Revisar escritos"],["errores","⚠️ Errores frecuentes"],["datos","💾 Datos"],["guia","📘 Guía"]];
function teacher(tab,arg){
  const body={vivo:tVivo,curso:tCurso,escritos:tEscritos,errores:tErrores,datos:tDatos,guia:tGuia,est:tEst}[tab](arg);
  $(`<div class="lhead"><button class="iconbtn" onclick="players()">←</button><h2 style="font-size:28px">Panel docente</h2></div>
   <div class="tabs">${TABS.map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="teacher('${k}')">${n}</button>`).join("")}</div>${body}`);
  if(tab==="vivo")vivoMount();
}
const allStudents=()=>{const s=new Set(Object.keys(DB.students));DB.log.forEach(e=>s.add(e.u));return [...s].sort();};
function pendingTexts(){const out=[];allStudents().forEach(u=>MISSIONS.forEach(m=>{const at=attempts(u,m.id,2).filter(x=>x.x).sort((a,b)=>b.ts-a.ts);if(at.length)out.push({u,m,x:at[0].x,ts:at[0].ts,v:DB.valid[u+"|"+m.id]});}));return out;}
function tCurso(){
  const st=allStudents();
  if(!st.length)return `<div class="panel"><p class="lead">Aún no hay datos. Cuando los estudiantes jueguen, aquí verás sus niveles.</p></div>`;
  const pend=pendingTexts().filter(p=>p.v===undefined).length;
  const dist=MISSIONS.map(m=>{const c=[0,0,0,0,0];st.forEach(u=>c[level(u,m.id)]++);return c;});
  return `<div class="panel">
   <p class="muted">${st.length} estudiantes · ${DB.log.length} registros${pend?` · <b>${pend} escritos por revisar</b>`:""}. Toca un estudiante para ver su detalle.</p>
   <div class="legend">${[1,2,3,4].map(l=>lvlChip(l)).join("")}</div>
   <div class="scroll"><table class="tbl"><thead><tr><th>Estudiante</th>${MISSIONS.map((m,i)=>`<th class="c" title="${m.n}">${m.e} M${i+1}</th>`).join("")}<th class="c">Última actividad</th></tr></thead><tbody>
   ${st.map(u=>{const last=Math.max(0,...DB.log.filter(e=>e.u===u).map(e=>e.ts));
     return `<tr onclick="teacher('est','${esc(u)}')" style="cursor:pointer"><td><b>${pname(u)}</b></td>${MISSIONS.map(m=>{const l=level(u,m.id);return `<td class="c"><span class="lvl lv${l}">${l||"–"}</span>${hasText(u,m.id)&&DB.valid[u+"|"+m.id]===undefined?" ✍️":""}</td>`;}).join("")}<td class="c" style="font-size:14px">${last?new Date(last).toLocaleDateString("es-CL"):"—"}</td></tr>`;}).join("")}
   <tr><td><b>Curso: logrado o más</b></td>${dist.map(c=>`<td class="c"><b>${Math.round((c[3]+c[4])/st.length*100)}%</b></td>`).join("")}<td></td></tr>
   </tbody></table></div>
   <p class="muted" style="font-size:15px;margin-top:10px">Niveles: 1 Inicial (intentó) · 2 En desarrollo (≥70% en Etapa 1) · 3 Logrado (≥70% en Etapa 2 con máx. 1 pista) · 4 Avanzado (Etapa 3 validada por usted). ✍️ = escrito por revisar. En parejas, la evidencia queda registrada para ambos.</p></div>`;
}
function tEst(u){
  const evs=DB.log.filter(e=>e.u===u);
  const rows=[];MISSIONS.forEach(m=>[0,1,2].forEach(s=>attempts(u,m.id,s).forEach(a=>rows.push({m,s,a}))));
  rows.sort((x,y)=>y.a.ts-x.a.ts);
  const hints=evs.filter(e=>e.h).length, q=evs.filter(e=>e.k&&e.k!=="end"&&e.k!=="txt").length;
  const src=evs.filter(e=>e.m==="m3"&&e.k&&e.k.split(".").length===3);
  return `<div class="panel"><h2 style="font-size:28px">${pname(u)}</h2>
   <p class="muted">${q} respuestas · pistas usadas en ${q?Math.round(hints/q*100):0}% · tiempo promedio por caso ${q?Math.round(evs.filter(e=>e.t).reduce((s,e)=>s+e.t,0)/q):0} s</p>
   <div class="row" style="margin:12px 0;gap:8px">${MISSIONS.map((m,i)=>`<span>${m.e} M${i+1} ${lvlChip(level(u,m.id))}</span>`).join("")}</div>
   ${src.length?`<p class="muted">Lectura lateral: decidió después de investigar en ${Math.round(src.filter(e=>e.inv).length/src.length*100)}% de las fuentes.</p>`:""}
   <h3 style="margin:16px 0 8px">Historial de intentos</h3>
   <div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Misión</th><th>Etapa</th><th class="c">Resultado</th><th class="c">Pistas</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td style="font-size:14px">${new Date(r.a.ts).toLocaleString("es-CL",{dateStyle:"short",timeStyle:"short"})}</td><td>${r.m.e} ${r.m.n}</td><td>E${r.s+1}</td>
     <td class="c">${r.s===2?(r.a.x?"✍️ escrito":"—"):`${r.a.ok}/${r.a.n} (${Math.round(r.a.p*100)}%)${r.a.done?"":" · incompleto"}`}</td><td class="c">${r.s===2?"":r.a.h}</td></tr>`).join("")||`<tr><td colspan="5">Sin intentos.</td></tr>`}
   </tbody></table></div>
   <button class="btn ghost sm" style="margin-top:14px" onclick="delStudent('${esc(u)}')">Eliminar estudiante y sus datos</button></div>`;
}
function delStudent(u){const m=modal(`<h2 style="font-size:26px">¿Eliminar a ${pname(u)}?</h2><p class="muted" style="margin:8px 0 16px">Se borrarán sus registros de esta tablet.</p>
  <div class="row"><button class="btn ghost" id="no">Cancelar</button><button class="btn" id="ok">Eliminar</button></div>`);
  m.querySelector("#no").onclick=()=>m.remove();
  m.querySelector("#ok").onclick=()=>{delete DB.students[u];DB.log=DB.log.filter(e=>e.u!==u);Object.keys(DB.valid).forEach(k=>{if(k.startsWith(u+"|"))delete DB.valid[k];});PLAYERS=PLAYERS.filter(p=>p!==u);save();m.remove();teacher("curso");};}
function tEscritos(){

function importCode(code){
  code=code.trim();if(!code.startsWith("DP2:"))throw new Error("formato");
  const d=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
  const have=new Set(DB.log.map(e=>e.id));let added=0;
  d.log.forEach(r=>{if(have.has(r[0]))return;DB.log.push({id:r[0],u:r[1],m:r[2],s:r[3],a:r[4],k:r[5],ok:r[6],h:r[7],inv:r[8],t:r[9],ts:r[10],x:r[11]||undefined});added++;});
  Object.entries(d.students||{}).forEach(([k,v])=>{if(!DB.students[k])DB.students[k]=v;});
  Object.entries(d.valid||{}).forEach(([k,v])=>{if(DB.valid[k]===undefined)DB.valid[k]=v;});
  save();return added;
}

   </div>
   <div id="vres" style="margin-top:20px"></div>
   <p class="muted" style="font-size:14px;margin-top:12px">Se actualiza solo cada 4 segundos. Todo queda guardado en tu Google Sheets (pestañas Salas, Equipos y Respuestas).</p></div>`;
}
const vivoLink=()=>location.origin+location.pathname+"?sala="+DB.live.sala+"&api="+DB.live.id;
async function vivoConnect(){
  const u=document.getElementById("vu").value.trim(),k=document.getElementById("vk").value,msg=document.getElementById("vmsg");
  const mm=u.match(/macros\/s\/([A-Za-z0-9_-]+)/);
  if(!mm){msg.innerHTML=`<div class="fb bad"><p>La URL debe verse así: https://script.google.com/macros/s/…/exec</p></div>`;return;}
  msg.innerHTML=`<p class="muted" style="margin-top:10px">Probando conexión…</p>`;
  try{const r=await api(mm[1],{a:"ping",clave:k});if(!r.docente)throw new Error("La clave docente no coincide con la del código.");DB.live.id=mm[1];DB.live.clave=k;save();toast("Conexión lista ✓");teacher("vivo");}
  catch(e){msg.innerHTML=`<div class="fb bad"><p>${esc(e.message==="Failed to fetch"?"No se pudo conectar. Revisa que la implementación tenga acceso «Cualquier persona».":e.message)}</p></div>`;}
}
async function vivoCreate(){
  const msg=document.getElementById("vmsg");msg.innerHTML=`<p class="muted" style="margin-top:10px">Creando sala…</p>`;
  try{const r=await api(DB.live.id,{a:"crear",clave:DB.live.clave,mision:DB.live.m});DB.live.sala=r.sala;DB.live.estado="espera";save();teacher("vivo");}
  catch(e){msg.innerHTML=`<div class="fb bad"><p>${esc(e.message)}</p></div>`;}
}
async function vivoState(est){
  try{await api(DB.live.id,{a:est==="jugando"?"iniciar":"terminar",sala:DB.live.sala,clave:DB.live.clave});DB.live.estado=est;save();vivoRefresh();}catch(e){toast(e.message);}
}
function vivoButtons(est){
  const b=document.getElementById("vbtns");if(!b)return;
  b.innerHTML=est==="espera"?`<button class="btn y" onclick="vivoState('jugando')">▶ Comenzar desafío</button>`
   :est==="jugando"?`<button class="btn" onclick="vivoState('terminado')">■ Terminar</button>`
   :`<span class="chip">Sala terminada</span><button class="btn y" onclick="DB.live.sala='';save();teacher('vivo')">Nueva sala</button>`;
}
function vivoMount(){
  const V=DB.live;if(!V.id||!V.sala)return;
  const q=document.getElementById("qr");
  try{if(window.QRCode)new QRCode(q,{text:vivoLink(),width:300,height:300,colorDark:"#22305E",colorLight:"#ffffff"});else q.innerHTML='<p class="muted" style="width:260px">No se pudo cargar el QR. Usa el link.</p>';}catch(e){}
  vivoButtons(V.estado||"espera");
  every(4000,vivoRefresh);
}
async function vivoRefresh(){
  const V=DB.live;let r;
  try{r=await api(V.id,{a:"resultados",sala:V.sala,clave:V.clave});}catch(e){const d=document.getElementById("vres");if(d)d.innerHTML=`<p class="muted">⚠️ Sin conexión con la hoja: ${esc(e.message)}</p>`;return;}
  if(!document.getElementById("vres"))return;
  if(r.estado!==V.estado){V.estado=r.estado;save();}vivoButtons(r.estado);
  const list=liveItems(r.mision||V.m),N=list.length;
  document.getElementById("vn").textContent=r.equipos.length;
  document.getElementById("vteams").innerHTML=r.equipos.map(t=>`<span class="chip">🕵️ ${esc(t.nombre)}</span>`).join("")||`<p class="muted">Esperando que escaneen el QR…</p>`;
  if(r.estado==="espera"){document.getElementById("vres").innerHTML="";return;}
  const tot=r.equipos.reduce((s,t)=>s+t.n,0),okT=r.equipos.reduce((s,t)=>s+t.ok,0),fin=r.equipos.filter(t=>t.n>=N).length;
  const eqs=[...r.equipos].sort((a,b)=>b.n-a.n||b.ok-a.ok);
  const items=list.map((x,i)=>{const s=r.items[i]||{n:0,ok:0};return {i,txt:x.it.s,n:s.n,ok:s.ok,p:s.n?s.ok/s.n:null};});
  const worst=items.filter(x=>x.n>=2).sort((a,b)=>a.p-b.p)[0];
  document.getElementById("vres").innerHTML=`
   <div class="row" style="gap:12px;margin-bottom:16px">
    <div class="card2" style="flex:1;margin:0"><b style="font-size:36px">${tot?Math.round(okT/tot*100):0}%</b><br><span class="muted">aciertos del curso</span></div>
    <div class="card2" style="flex:1;margin:0"><b style="font-size:36px">${fin}/${r.equipos.length}</b><br><span class="muted">equipos terminaron</span></div>
    <div class="card2" style="flex:2;margin:0"><b>⚠️ Caso más difícil</b><br>${worst?`<span>${esc(worst.txt)}</span> <b style="color:var(--bad)">${Math.round(worst.p*100)}% acierta</b>`:'<span class="muted">Aún sin datos suficientes</span>'}</div></div>
   <div class="challenge two">
    <div><h3 style="font-size:22px;margin-bottom:8px">Equipos</h3><div class="scroll"><table class="tbl"><thead><tr><th>Equipo</th><th>Avance</th><th class="c">Aciertos</th><th class="c">Pistas</th></tr></thead><tbody>
     ${eqs.map(t=>`<tr><td><b>${esc(t.nombre)}</b></td><td style="min-width:120px"><div class="bar"><i style="width:${Math.round(t.n/N*100)}%;background:var(--navy)"></i></div><span style="font-size:13px">${t.n}/${N}</span></td><td class="c">${t.n?Math.round(t.ok/t.n*100)+"%":"–"}</td><td class="c">${t.pistas}</td></tr>`).join("")}</tbody></table></div></div>
    <div><h3 style="font-size:22px;margin-bottom:8px">Casos</h3><div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>Caso</th><th class="c">Acierta</th></tr></thead><tbody>
     ${items.map(x=>`<tr><td>${x.i+1}</td><td style="font-size:14px">${esc(x.txt)}</td><td class="c"><span class="lvl ${x.p===null?'lv0':x.p<.5?'lv1':x.p<.75?'lv2':'lv3'}">${x.p===null?"–":Math.round(x.p*100)+"%"}</span><br><span style="font-size:12px" class="muted">${x.n} resp.</span></td></tr>`).join("")}</tbody></table></div></div>
   </div>`;
}

/* ===================== INICIO ===================== */
if(QS.get("sala")&&QS.get("api"))liveStart();else players();

</script>
